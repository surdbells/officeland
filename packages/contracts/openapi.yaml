openapi: 3.1.0
info:
  title: 'OfficeLand Catalogue API'
  description: "Public catalogue endpoints for the OfficeLand storefront.\n\nThe storefront is prerendered to static HTML, so these endpoints are\nconsumed mainly by the build-time render worker and by client-side\nfacet filtering - not on the critical path of a page view.\n\nNo prices are returned anywhere: OfficeLand is quote-first, and\n`pricing_mode` drives the call to action from data rather than from a\nhardcoded rule."
  version: 1.0.0
servers:
  -
    url: 'https://officelandng.com'
    description: Production
  -
    url: 'http://localhost:8095'
    description: 'Local development'
paths:
  /api/v1/home:
    get:
      tags:
        - Home
      summary: 'Homepage content'
      description: 'Curated homepage content. Empty sections mean the storefront keeps its built-in derived behaviour.'
      operationId: getHome
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data: { $ref: '#/components/schemas/Home' }
                type: object
  /api/v1/navigation:
    get:
      tags:
        - Navigation
      summary: 'Navigation tree'
      description: 'Full category tree plus featured brands. Feeds the megamenu; heavily cached.'
      operationId: getNavigation
      responses:
        '200':
          description: OK
  '/api/v1/products/{slug}':
    get:
      tags:
        - Products
      summary: 'Product detail'
      description: 'Full PDP payload: brand, primary category, breadcrumb, grouped specifications, variants and typed relations.'
      operationId: getProduct
      parameters:
        -
          name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/search:
    get:
      tags:
        - Search
      summary: 'Search products'
      description: 'Full-text search with trigram fallback, synonym expansion and faceted filtering. Results pages are noindex (SEO_SPEC.md section 2).'
      operationId: search
      parameters:
        -
          name: q
          in: query
          schema:
            type: string
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
        -
          name: per_page
          in: query
          schema:
            type: integer
            default: 24
        -
          name: sort
          in: query
          schema:
            type: string
            enum:
              - relevance
              - newest
              - name
      responses:
        '200':
          description: OK
  /api/v1/search/suggest:
    get:
      tags:
        - Search
      summary: 'Search suggestions'
      description: 'Typeahead. Grouped into products, categories and brands. Budgeted at p95 <= 50ms.'
      operationId: searchSuggest
      parameters:
        -
          name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
components:
  schemas:
    Error:
      title: 'Error envelope'
      description: 'Consistent error shape (section 8.3). trace_id correlates to the structured logs.'
      required:
        - error
      properties:
        error:
          required:
            - code
            - message
          properties:
            code:
              description: "OpenAPI 3.1 document root.\n\nThe spec is generated from these attributes, committed to\npackages/contracts, and the storefront's TypeScript types are generated\nfrom it. Hand-written HTTP calls in the Angular app are a review rejection\n(MASTER BUILD PROMPT section 15.1), and a contract change not reflected in\npackages/contracts is a failed gate (section 6.2)."
              type: string
              example: NotFoundHttpException
            message:
              type: string
            details:
              type: array
              items:
                type: string
            trace_id:
              type:
                - string
                - 'null'
              format: uuid
          type: object
      type: object
    Brand:
      required:
        - uuid
        - name
        - slug
        - url
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
          example: HP
        slug:
          type: string
          example: hp
        url:
          type: string
          example: /brands/hp/
        description_html:
          type:
            - string
            - 'null'
        is_featured:
          type: boolean
        product_count:
          type: integer
        seo:
          $ref: '#/components/schemas/Seo'
      type: object
    Seo:
      properties:
        meta_title:
          type:
            - string
            - 'null'
        meta_description:
          type:
            - string
            - 'null'
        canonical_override:
          type:
            - string
            - 'null'
        is_indexable:
          type: boolean
      type: object
    BreadcrumbItem:
      required:
        - name
        - url
      properties:
        name:
          type: string
        url:
          type: string
      type: object
    Category:
      required:
        - uuid
        - name
        - slug
        - path
        - url
        - depth
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
          example: 'Executive Chairs'
        slug:
          type: string
          example: executive-chairs
        path:
          type: string
          example: /office-furniture/seating/executive-chairs/
        url:
          type: string
          example: /c/office-furniture/seating/executive-chairs/
        depth:
          type: integer
          maximum: 3
          minimum: 1
        intro_copy:
          type:
            - string
            - 'null'
        description_html:
          type:
            - string
            - 'null'
        product_count:
          type: integer
        hero:
          oneOf:
            -
              $ref: '#/components/schemas/Image'
              description: 'The category hero image, or null. Rendered as a <picture>; the storefront falls back to a typographic treatment when absent, so an image is always an improvement and never a prerequisite.'
            -
              type: 'null'
          description: 'The category hero image, or null. Rendered as a <picture>; the storefront falls back to a typographic treatment when absent, so an image is always an improvement and never a prerequisite.'
        hero_inherited:
          oneOf:
            -
              $ref: '#/components/schemas/Image'
              description: "The nearest ancestor category's hero, returned only when this category has none of its own. Used for the page hero so every category page carries an image; NOT used for chips or child cards, where inheriting would show one photograph five times."
            -
              type: 'null'
          description: "The nearest ancestor category's hero, returned only when this category has none of its own. Used for the page hero so every category page carries an image; NOT used for chips or child cards, where inheriting would show one photograph five times."
        siblings:
          description: 'Categories alongside this one, returned only when it has no children of its own. Drives the chip row on a leaf page.'
          type: array
          items:
            $ref: '#/components/schemas/Category'
        children:
          description: 'Rendered as real crawlable anchors on every category page (D-011).'
          type: array
          items:
            $ref: '#/components/schemas/Category'
        product_links:
          description: 'Every product in a LEAF category, as crawlable {name, url} anchors. A leaf sits at <=2 clicks from home, so linking its products directly here keeps them within the 3-click budget (SEO_SPEC 10.5) regardless of how many pages the paginated grid spans. Absent on non-leaf categories, whose products are reached through their own leaves.'
          type: array
          items:
            $ref: '#/components/schemas/BreadcrumbItem'
        breadcrumb:
          type: array
          items:
            $ref: '#/components/schemas/BreadcrumbItem'
        seo:
          $ref: '#/components/schemas/Seo'
      type: object
    Image:
      description: 'One image, shaped for a <picture> element (section 12.5). Only derivatives that actually exist are advertised - generation is resumable, so a srcset must never promise a 404.'
      required:
        - uuid
        - alt
        - sources
      properties:
        uuid:
          type: string
          format: uuid
        alt:
          description: 'Never empty: alt text is required before media may be attached (section 12.6).'
          type: string
        width:
          description: 'Intrinsic width of the fallback. Set on the img to prevent layout shift.'
          type:
            - integer
            - 'null'
        height:
          type:
            - integer
            - 'null'
        role:
          type: string
          enum:
            - primary
            - gallery
            - spec_sheet
            - lifestyle
        src:
          description: 'Fallback JPEG for the img element.'
          type:
            - string
            - 'null'
          example: /media/ab/cd/<sha>/pdp-800.jpeg
        sources:
          description: 'Ordered best-format-first: AVIF, WebP, then JPEG.'
          type: array
          items:
            properties:
              type:
                type: string
                example: image/avif
              srcset:
                type: string
                example: '/media/.../card-400.avif 400w, /media/.../pdp-800.avif 800w'
            type: object
      type: object
    ProductCard:
      description: 'Listing payload. One shape shared by PLP, search, related rails and collections.'
      required:
        - uuid
        - name
        - slug
        - url
        - availability
        - pricing_mode
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        url:
          type: string
          example: /p/hp-128a-black-laserjet-toner-ce320a/
        sku:
          type:
            - string
            - 'null'
        mpn:
          type:
            - string
            - 'null'
        model_code:
          type:
            - string
            - 'null'
        brand:
          oneOf:
            -
              $ref: '#/components/schemas/Brand'
            -
              type: 'null'
        availability:
          type: string
          enum:
            - in_stock
            - limited
            - made_to_order
            - lead_time
            - discontinued
        lead_time_days:
          type:
            - integer
            - 'null'
        pricing_mode:
          description: 'No prices are returned (D-002). This drives the call to action from data.'
          type: string
          enum:
            - public
            - quote_only
        min_order_qty:
          type: integer
          minimum: 1
        qty_step:
          type: integer
          minimum: 1
        short_description:
          description: 'A sentence or two for the card, clamped by the storefront. The full description_html stays on the PDP payload.'
          type:
            - string
            - 'null'
        key_specs:
          description: '4-6 bullets shown above the fold, ordered by the source"s own buyer-orientation priority (Icecat ProductFeature@No). Present only when the caller loaded attribute values.'
          type: array
          items:
            required:
              - label
              - value
            properties:
              label:
                type: string
                example: 'Page yield'
              value:
                type: string
                example: '2,000 pages'
            type: object
        image:
          oneOf:
            -
              $ref: '#/components/schemas/Image'
              description: 'The primary image only. A 24-item grid does not need four gallery shots per card.'
            -
              type: 'null'
          description: 'The primary image only. A 24-item grid does not need four gallery shots per card.'
      type: object
    HeroSlide:
      description: 'One slide of the homepage hero carousel. Managed in admin; the storefront falls back to department-derived slides when none are active.'
      required:
        - headline
      properties:
        headline:
          type: string
        subheadline:
          type:
            - string
            - 'null'
        cta_label:
          type:
            - string
            - 'null'
        cta_url:
          type:
            - string
            - 'null'
        secondary_cta_label:
          type:
            - string
            - 'null'
        secondary_cta_url:
          type:
            - string
            - 'null'
        image:
          oneOf:
            -
              $ref: '#/components/schemas/Image'
            -
              type: 'null'
      type: object
    HomeCategoryTile:
      description: 'One tile in the homepage "Shop by category" grid - a curated pointer to a category.'
      required:
        - name
        - url
        - product_count
      properties:
        name:
          type: string
        url:
          type: string
          example: /c/it-products/computers/laptops/
        product_count:
          type: integer
        image:
          oneOf:
            -
              $ref: '#/components/schemas/Image'
            -
              type: 'null'
      type: object
    Home:
      description: 'Editorial content for the homepage. Every section is optional: an empty array means the storefront keeps its built-in derived behaviour for that section.'
      required:
        - hero_slides
        - category_picks
        - product_picks
      properties:
        hero_slides:
          type: array
          items:
            $ref: '#/components/schemas/HeroSlide'
        category_picks:
          type: array
          items:
            $ref: '#/components/schemas/HomeCategoryTile'
        product_picks:
          description: 'The curated "best sellers" band. Empty means the storefront fills the band from the catalogue instead.'
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
      type: object
    SpecificationGroup:
      description: 'Specifications arrive already grouped from the source (Icecat CategoryFeatureGroup).'
      required:
        - group
        - items
      properties:
        group:
          type: string
          example: PERFORMANCE
        items:
          type: array
          items:
            properties:
              label:
                type: string
                example: 'Page yield'
              value:
                description: 'Formatted for display.'
                type: string
                example: '2,000 pages'
              value_raw:
                description: 'For search and compare.'
                type: string
                example: '2000'
              unit:
                type:
                  - string
                  - 'null'
            type: object
      type: object
    Product:
      type: object
      allOf:
        -
          $ref: '#/components/schemas/ProductCard'
        -
          properties:
            ean:
              type:
                - string
                - 'null'
            primary_category:
              oneOf:
                -
                  $ref: '#/components/schemas/Category'
                -
                  type: 'null'
            breadcrumb:
              type: array
              items:
                $ref: '#/components/schemas/BreadcrumbItem'
            short_description:
              type:
                - string
                - 'null'
            description_html:
              type:
                - string
                - 'null'
            warranty_text:
              type:
                - string
                - 'null'
            images:
              description: 'The full gallery, primary first. The storefront gives the first image fetchpriority=high as the LCP element.'
              type: array
              items:
                $ref: '#/components/schemas/Image'
            specifications:
              type: array
              items:
                $ref: '#/components/schemas/SpecificationGroup'
            related:
              description: 'Typed relations supplied by the source rather than hand-curated (ICECAT_MAPPING.md F-3), keyed by relation type: accessory, compatible-with, replacement. This is what answers "which toner fits this printer".'
              type: object
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCard'
            seo:
              $ref: '#/components/schemas/Seo'
          type: object
    BasketLine:
      description: 'One line of a quote basket. The quantity rules travel with the line so the storefront stepper cannot offer a quantity the server would silently change.'
      required:
        - id
        - qty
        - name
        - is_free_text
      properties:
        id:
          description: 'Addressed by every mutation, and scoped to the caller"s own basket server-side.'
          type: string
        qty:
          type: integer
          minimum: 1
        note:
          type:
            - string
            - 'null'
        min_order_qty:
          type: integer
          minimum: 1
        qty_step:
          type: integer
          minimum: 1
        quantity_note:
          type:
            - string
            - 'null'
          example: 'Minimum 4, in multiples of 5'
        is_free_text:
          description: 'A request for something the catalogue does not list.'
          type: boolean
        name:
          type: string
        url:
          type:
            - string
            - 'null'
        sku:
          type:
            - string
            - 'null'
        mpn:
          type:
            - string
            - 'null'
        brand:
          type:
            - string
            - 'null'
        availability:
          type:
            - string
            - 'null'
        lead_time_days:
          type:
            - integer
            - 'null'
      type: object
    Basket:
      description: 'The quote basket. No prices and no total anywhere (D-002). An absent basket is returned as an empty one, so the storefront needs one code path rather than two.'
      required:
        - items
        - line_count
        - unit_count
      properties:
        uuid:
          type:
            - string
            - 'null'
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/BasketLine'
        line_count:
          type: integer
        unit_count:
          type: integer
        max_lines:
          type: integer
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
      type: object
    QuoteConfirmation:
      description: 'What a buyer is shown after submitting. The reference is the string they quote on the phone.'
      required:
        - reference
        - email
      properties:
        reference:
          type: string
          example: OL-Q-2026-000001
        email:
          type: string
          format: email
        submitted_at:
          type:
            - string
            - 'null'
          format: date-time
        line_count:
          type: integer
        response_expectation:
          type: string
          example: 'We respond within one business day.'
      type: object
tags:
  -
    name: Navigation
    description: 'Category tree and featured brands'
  -
    name: Home
    description: 'Homepage editorial content'
  -
    name: Products
    description: 'Product detail'
  -
    name: Search
    description: Search
