# aaPanel Nginx vhost — reverse proxy to the OfficeLand stack.
#
# Paste the location blocks into the site's "Configuration File" in aaPanel,
# INSIDE the existing server{} block that aaPanel generated for the domain.
# Leave aaPanel's own listen/ssl/access_log lines alone: it manages the
# certificate renewal, and rewriting them by hand is how a renewal silently
# stops working.
#
# ── Why a proxy and not an Nginx port of the whole thing ─────────────────
# Everything this application needs from a web server already exists, tested,
# in the Caddy layer inside the container: the Content-Security-Policy with
# per-build script hashes, 181 legacy redirects, the immutable-vs-revalidate
# cache split, the real 404 (not a soft one), and the staging noindex. All of
# it is GENERATED — `csp-hashes.mjs` and `redirects:publish` emit Caddy syntax
# — and all of it is verified by gates that read Caddy's output.
#
# Reimplementing that in Nginx means maintaining a second copy of rules whose
# whole purpose is to be correct, re-verifying every gate against it, and
# regenerating both on every deploy. The proxy keeps one copy and one set of
# gates. Nginx does what aaPanel is good at — TLS, the domain, the firewall.
#
# ── The upstream is loopback-only ────────────────────────────────────────
# compose binds 127.0.0.1 (BIND_ADDR). Nothing reaches the app except through
# this vhost, so TLS cannot be bypassed by hitting the port directly.

client_max_body_size 32m;

location / {
    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;

    # Caddy trusts private ranges (trusted_proxies in the Caddyfile), so these
    # are what make it see the real client and the real scheme. Without
    # X-Forwarded-Proto it believes every request is plain HTTP and Laravel
    # generates http:// URLs behind an https:// site — which breaks canonical
    # tags, the sitemap and every link in a quotation email.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # The storefront is static files; the API is Octane. Neither streams, and
    # buffering is what keeps a slow client from occupying a PHP worker.
    proxy_buffering on;
    proxy_read_timeout 60s;

    # Security headers, the CSP and cache-control all come from the upstream.
    # Do NOT add_header them here as well: `add_header` in Nginx does not
    # replace an upstream header, it appends a second one, and two
    # Content-Security-Policy headers are intersected — the effective policy
    # becomes whichever is more restrictive, which is not the one that was
    # tested.
}

# Media is served from a Docker volume by the upstream, and it is immutable:
# the path contains the SHA-256 of the bytes, so a given URL can never change
# content. A year is the correct max-age and the upstream already sets it;
# this block exists only to keep the proxy timeout generous for large files.
location /media/ {
    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# aaPanel writes its own error pages for 404 by default on some templates.
# Turn that off: this application serves a real 404 document with a real 404
# status, and replacing it with aaPanel's would undo the soft-404 fix.
proxy_intercept_errors off;
