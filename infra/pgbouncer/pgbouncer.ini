;; OfficeLand — PgBouncer
;; See docs/ARCHITECTURE.md section 5 for the consequences of transaction
;; pooling and how each is handled in application code.

[databases]
;; Application pool. Everything the API does goes through here.
officeland = host=postgres port=5432 dbname=officeland

;; Admin/Filament traffic is pooled separately so a slow report in the admin
;; cannot exhaust the connections the storefront API depends on.
officeland_admin = host=postgres port=5432 dbname=officeland pool_size=5

;; Queue workers, including the render worker.
officeland_queue = host=postgres port=5432 dbname=officeland pool_size=5

;; Test database. Registered here deliberately: section 19.2 requires the
;; integration suite to run THROUGH the pooler, because a suite that connects
;; direct cannot catch the prepared-statement failures that transaction
;; pooling introduces.
officeland_test = host=postgres port=5432 dbname=officeland_test pool_size=10

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; ---------------------------------------------------------------------------
;; Transaction pooling: maximum connection efficiency with Octane workers.
;; Consequences handled in application code (docs/ARCHITECTURE.md section 5):
;;   - PDO::ATTR_EMULATE_PREPARES => true  (prepared statements do not survive)
;;   - search_path set via ALTER ROLE, never per-session SET
;;   - no LISTEN/NOTIFY, no cross-transaction advisory locks, no WITH HOLD
;;   - migrations connect DIRECT to Postgres, bypassing this pooler
;; ---------------------------------------------------------------------------
pool_mode = transaction

;; ---------------------------------------------------------------------------
;; Pool sizing.
;;
;;   default_pool_size = octane_workers x connections_per_worker x safety
;;   max_client_conn   = sum(pool sizes) x client_multiplier
;;
;; The values below are DEVELOPMENT DEFAULTS derived for 4 Octane workers.
;; Production sizing depends on the server core count, which is open question
;; Q7. This file must be recalculated and the arithmetic recorded in
;; ARCHITECTURE.md before go-live — it is a Phase 13 hardening gate.
;; ---------------------------------------------------------------------------
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 200
max_db_connections = 50

server_idle_timeout = 600
server_lifetime = 3600
query_wait_timeout = 120

;; ---------------------------------------------------------------------------
;; max_prepared_statements = 0 — DO NOT RAISE THIS.
;;
;; PgBouncer >= 1.21 can track and replay named prepared statements across
;; server connections, and section 10.1 offers it as one of two ways to survive
;; transaction pooling. It was set to 200. It breaks transactions:
;;
;;   BEGIN                         -> ok
;;   SELECT 1                      -> ok
;;   <any prepared statement>      -> SQLSTATE[25P02] transaction is aborted
;;
;; Every DB::transaction() containing a model write failed. Reproduced by
;; toggling this single value with everything else held constant.
;;
;; Section 10.1 other option — PDO::ATTR_EMULATE_PREPARES => true — is also
;; unusable: emulation interpolates bindings, rendering a PHP boolean as bare
;; `1`, which PostgreSQL refuses to coerce to boolean (found in Phase 2).
;;
;; So NEITHER documented strategy works as written. What does work is neither:
;; PgBouncer does not track prepared statements, PDO does not emulate them, and
;; the server connection stays pinned for the life of each transaction, which
;; is all that was ever needed.
;;
;; Guarded by PgBouncerTransactionTest and PgBouncerIntegrationTest.
;; ---------------------------------------------------------------------------
max_prepared_statements = 0

ignore_startup_parameters = extra_float_digits,options,search_path

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

admin_users = officeland
stats_users = officeland
