# OfficeLand CI
#
# Stage order follows MASTER BUILD PROMPT section 19.3:
#   lint + static analysis -> unit -> integration -> build -> (Lighthouse,
#   SEO regression, a11y, security audit added in Phases 8, 13)
#
# Cheap, fast-failing stages run first so a formatting mistake does not wait
# behind a container build.

name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.3"
  # Angular CLI 22 requires >= 24.15.0.
  NODE_VERSION: "24.19.0"

jobs:
  api-static:
    name: API · lint + static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, intl, zip, bcmath, gd, exif
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: apps/api

      - name: Lint (Pint)
        run: vendor/bin/pint --test
        working-directory: apps/api

      - name: Static analysis (PHPStan level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
        working-directory: apps/api

      # A dependency with a known advisory must not reach production. This is
      # not advisory-only: Laravel 11 was rejected at Phase 1 on exactly this
      # basis (docs/DECISIONS.md D-019).
      - name: Security audit
        run: composer audit --no-interaction
        working-directory: apps/api

  api-tests:
    name: API · tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: officeland
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: officeland
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U officeland"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, intl, zip, bcmath, gd, exif
          coverage: xdebug

      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: apps/api

      - run: cp .env.example .env && php artisan key:generate
        working-directory: apps/api

      - name: Test suite
        run: php artisan test
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DIRECT_HOST: 127.0.0.1
          DB_DIRECT_PORT: 5432
          REDIS_HOST: 127.0.0.1

  web-static:
    name: Web · lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci --no-audit --fund=false
        working-directory: apps/web

      # strict + strictTemplates, per MASTER BUILD PROMPT section 19.3.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: apps/web

      - run: npm audit --audit-level=high
        working-directory: apps/web
        continue-on-error: false

  web-build:
    name: Web · build + prerender + raw-HTML gate
    runs-on: ubuntu-latest

    # The prerender fetches its route list and its page data from the API
    # (D-009). Without one it renders only the static routes, and the raw-HTML
    # gate has no product or category page to inspect — which is exactly the
    # blind spot that let a broken catalogue build succeed in Phase 7.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: officeland
          POSTGRES_PASSWORD: officeland
          POSTGRES_DB: officeland
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U officeland"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, intl, bcmath

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: apps/api

      # CI talks to PostgreSQL directly. PgBouncer is not in the loop here, so
      # this job cannot catch D-024-class pooling bugs — PgBouncerConcurrencyTest
      # in the api-test job is what covers those.
      - name: Prepare the catalogue the prerender will read
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DIRECT_HOST: 127.0.0.1
          DB_DIRECT_PORT: '5432'
          DB_DATABASE: officeland
          DB_USERNAME: officeland
          DB_PASSWORD: officeland
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force --database=pgsql_direct
          php artisan db:seed --class=TaxonomySeeder --force
          php artisan db:seed --class=DemoCatalogueSeeder --force

      - name: Serve the API for the prerender
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DIRECT_HOST: 127.0.0.1
          DB_DIRECT_PORT: '5432'
          DB_DATABASE: officeland
          DB_USERNAME: officeland
          DB_PASSWORD: officeland
        run: |
          php artisan serve --host=127.0.0.1 --port=8095 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8095/api/v1/render/manifest >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8095/api/v1/render/manifest >/dev/null \
            || { echo "::error::API did not come up"; exit 1; }

      - run: npm ci --no-audit --fund=false
        working-directory: apps/web

      - run: npm test -- --no-watch
        working-directory: apps/web

      - run: npm run build
        working-directory: apps/web
        env:
          PRERENDER_API_ORIGIN: http://127.0.0.1:8095

      # The storefront is served as static files (docs/DECISIONS.md D-009).
      # If the build stops emitting prerendered HTML, every SEO gate downstream
      # is meaningless, so assert it here rather than discovering it at Phase 8.
      - name: Assert prerendered output exists
        working-directory: apps/web
        run: |
          test -f dist/web/browser/index.html || { echo "::error::no prerendered index.html"; exit 1; }
          grep -q 'ng-server-context' dist/web/browser/index.html \
            || { echo "::error::index.html is not server-rendered"; exit 1; }
          echo "prerendered $(find dist/web/browser -name '*.html' | wc -l) HTML file(s)"

      # SEO_SPEC.md section 10.1. Reads the built files with no browser and no
      # JavaScript, which is what a crawler does. Section 10.1 requires this to
      # run even though D-009 reduces it to reading files, "because a
      # regression in the render pipeline is otherwise silent" — in Phase 7 it
      # caught a placeholder <title> on every catalogue page, and 64 of 136
      # pages rendering "not found".
      - name: Raw-HTML gate
        working-directory: apps/web
        run: npm run gate:raw-html

      # SEO_SPEC.md sections 10.4 and 10.5. Walks the prerendered files following
      # only real <a href> — no JavaScript, no sitemap, no manifest. The sitemap
      # and the manifest are both generated from the database and would agree
      # with each other while the actual link graph was broken; this measures
      # what a crawler can reach, which is the only thing that counts.
      - name: Crawl-depth and orphan gate
        working-directory: apps/web
        run: npm run gate:crawl-depth

      # Phase 13a. The CSP in infra/caddy/csp.caddy hashes the inline scripts
      # Angular emits. If a build changes what it inlines, Caddy would serve a
      # policy that blocks every page -- silently, for users, with a console
      # message nobody sees. This fails the build instead.
      - name: Content-Security-Policy gate
        working-directory: apps/web
        run: npm run gate:csp

      # Phase 13c. axe-core over every prerendered page under jsdom. Catches
      # the structural WCAG rules; colour-contrast and target-size need real
      # rendering and are verified in a browser instead (docs/ACCESSIBILITY.md).
      #
      # Every page, not a sample: the 9-page sample passed while a CRITICAL
      # invalid-ARIA violation sat on 7 brand pages.
      - name: Accessibility gate (WCAG 2.2 AA)
        working-directory: apps/web
        run: npm run gate:a11y

  contract:
    name: Contract · spec and types in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, redis, intl, zip, bcmath, gd, exif
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: apps/api

      # Section 6.2: a contract change that is not reflected in
      # packages/contracts is a failed gate. Regenerate and diff rather than
      # trusting anyone to remember.
      - name: Regenerate spec and types
        run: |
          cd apps/api
          vendor/bin/openapi app --output ../../packages/contracts/openapi.yaml --format yaml --version 3.1.0
          cd ../../packages/contracts
          npx -y openapi-typescript@latest openapi.yaml -o api.d.ts

      - name: Fail if the committed contract has drifted
        run: |
          if ! git diff --quiet -- packages/contracts; then
            echo "::error::packages/contracts is out of date. Regenerate and commit — see packages/contracts/README.md"
            git diff -- packages/contracts
            exit 1
          fi
          echo "contract is in sync"

  stack:
    name: Stack · compose smoke test
    runs-on: ubuntu-latest
    needs: [api-static, web-static]
    steps:
      - uses: actions/checkout@v4

      - run: cp .env.example .env

      - name: Build and start
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:8095/health/ready || true)
            if [ "$code" = "200" ]; then echo "ready"; cat /tmp/ready.json; exit 0; fi
            sleep 5
          done
          echo "::error::stack did not become ready"
          docker compose logs
          exit 1

      # Guards the requirement that staging must never be indexable
      # (MASTER BUILD PROMPT section 14.8). A leak here is slow to undo.
      - name: Assert non-production is not indexable
        run: |
          curl -sI http://127.0.0.1:8095/ | grep -qi 'x-robots-tag: noindex' \
            || { echo "::error::missing X-Robots-Tag on non-production"; exit 1; }
          curl -s http://127.0.0.1:8095/robots.txt | grep -q 'Disallow: /' \
            || { echo "::error::robots.txt is not blocking on non-production"; exit 1; }

      - name: Assert storefront is served as prerendered static HTML
        run: |
          curl -sf http://127.0.0.1:8095/ | grep -q 'ng-server-context' \
            || { echo "::error::storefront is not prerendered"; exit 1; }

      - if: failure()
        run: docker compose logs

      - if: always()
        run: docker compose down -v
