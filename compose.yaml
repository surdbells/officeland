# OfficeLand — local development stack.
# See docs/ARCHITECTURE.md section 1 for the production topology this mirrors.
#
#   docker compose up --build
#   -> http://localhost:8095        prerendered storefront (static)
#   -> http://localhost:8095/health/ready   API readiness probe
#
# The read replica is deliberately absent: docs/DECISIONS.md D-018 defers it to
# Phase 13 on disaster-recovery grounds, because static prerendering collapses
# request-path database load.

name: officeland

services:
  postgres:
    image: postgres:16-alpine
    # Continuous WAL archiving (Phase 13d).
    #
    # The sh wrapper exists to create and chown /backups before Postgres drops
    # to the postgres user. A named volume mounted at a path the image does not
    # contain is created root-owned, so archive_command would fail on every
    # segment — and archive failures are near-silent: Postgres retries forever,
    # pg_wal grows, and the first symptom anybody sees is a full disk.
    command:
      - sh
      - -c
      - >-
        mkdir -p /backups/wal /backups/base
        && chown -R postgres:postgres /backups
        && exec docker-entrypoint.sh postgres
        -c archive_mode=on
        -c "archive_command=test ! -f /backups/wal/%f && cp %p /backups/wal/%f"
        -c archive_timeout=300
        -c wal_level=replica
    environment:
      POSTGRES_USER: ${DB_USERNAME:-officeland}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_DATABASE:-officeland}
      # md5 so the PgBouncer userlist format matches. Production uses
      # scram-sha-256 with auth_query; see docs/RUNBOOK.md.
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Base backups and archived WAL (Phase 13d). A SEPARATE volume from
      # pgdata on purpose: a backup on the same device as the thing it backs
      # up is not a backup. In production this must be a different device or
      # host entirely — see Q21.
      - pgbackups:/backups
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Exposed for migrations, which connect DIRECT and never via PgBouncer
      # (docs/ARCHITECTURE.md section 5).
      - "${BIND_ADDR:-127.0.0.1}:${DB_DIRECT_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-officeland} -d ${DB_DATABASE:-officeland}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DB_POOLED_PORT:-6432}:6432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/frankenphp/Dockerfile
      target: ${BUILD_TARGET:-dev}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8095}
      OCTANE_WORKERS: ${OCTANE_WORKERS:-4}
      # Application traffic goes through the pooler.
      DB_CONNECTION: pgsql
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_DATABASE: ${DB_DATABASE:-officeland}
      DB_USERNAME: ${DB_USERNAME:-officeland}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      # Migrations bypass PgBouncer entirely.
      DB_DIRECT_HOST: postgres
      DB_DIRECT_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RENDER_WORKER_ORIGIN: http://render:4000
      STATIC_ROOT: /app/static
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - ./apps/api:/app
      # Named volume, NOT the bind mount. On Docker Desktop for Windows a read
      # from a bind-mounted file costs ~29ms; 500 vendor files took 14.5s
      # against 0.01s from container-local storage — measured, 1450x. Laravel
      # reads hundreds of files to boot, so a cold Octane worker could not
      # finish booting inside the 30s limit: it timed out, died, and the
      # replacement cold-booted into the same wall. Every endpoint, including
      # /health/live, took 15-40s.
      #
      # vendor/ is generated by composer and never hand-edited, so nothing is
      # lost by keeping it off the host filesystem. Same reasoning as
      # web_node_modules on the render service.
      #
      # After changing composer.json: docker compose exec api composer install
      - api_vendor:/app/vendor
      # The redirect map is an editorial artefact reviewed in pull requests,
      # so it lives in docs/ and is imported from there (Phase 14a).
      - ./docs:/docs:ro
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Generated CSP snippet, imported by the Caddyfile (Phase 13a).
      - ./infra/caddy/csp.caddy:/etc/caddy/csp.caddy:ro
      # Generated redirect snippet (Phase 14b).
      - ./infra/caddy/redirects.caddy:/etc/caddy/redirects.caddy:ro
      - static:/app/static
      - media:/app/storage-media
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8095}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health/live || exit 1"]
      interval: 15s
      # Raised from 5s: the admin panel made the first request after boot
      # materially heavier, and a probe that times out reports a healthy
      # container as unhealthy — which is worse than no probe at all.
      timeout: 15s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  # Always-on queue worker: drains the import and media queues in the background.
  #
  # Without this, queued work (Icecat import jobs, image derivatives) simply never
  # ran in production — a bulk import either had to generate images inline in a
  # fragile foreground command, or queued jobs that nobody consumed. This worker
  # processes them steadily, resiliently and OFF the request path, so a large
  # import can never again compete with live traffic or die with an SSH session.
  #
  # Bounded on purpose: --max-time recycles the process hourly (fresh memory, and
  # it re-reads code/autoload on restart), --memory makes it exit before it grows
  # too large, and the container limits below cap it so a runaway job can take at
  # most this worker down — never the whole box or the api.
  worker:
    # Same image as api (same Dockerfile/target); Docker's layer cache means this
    # second build is near-instant after the api build. Just a different command.
    build:
      context: .
      dockerfile: infra/docker/frankenphp/Dockerfile
      target: ${BUILD_TARGET:-dev}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8095}
      DB_CONNECTION: pgsql
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_DATABASE: ${DB_DATABASE:-officeland}
      DB_USERNAME: ${DB_USERNAME:-officeland}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_DIRECT_HOST: postgres
      DB_DIRECT_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
      # Image derivatives are written here, same as the api/CLI paths.
      - media:/app/storage-media
    # The image's default entrypoint boots FrankenPHP; the worker runs the queue
    # instead. It clears stale config and refreshes the autoloader (the vendor
    # volume shadows the image's classmap, so a newly added job class must be
    # re-dumped) before consuming jobs. A single `sh -c <script>` entrypoint,
    # not a folded command: entrypoint+command folding silently truncated the
    # script to its first word.
    entrypoint:
      - sh
      - -c
      - |
        php artisan config:clear >/dev/null 2>&1 || true
        composer dump-autoload --optimize --no-interaction --working-dir=/app >/dev/null 2>&1 || true
        exec php artisan queue:work redis --queue=imports,media,default \
          --sleep=1 --tries=3 --backoff=30 --max-time=3600 --max-jobs=1000 --memory=448 --timeout=300
    # The worker runs no web server, so the image's HTTP healthcheck would always
    # fail and report it unhealthy. It is not on the request path, so no probe.
    healthcheck:
      disable: true
    mem_limit: 1536m
    cpus: 2.0
    restart: unless-stopped

  render:
    build:
      context: .
      dockerfile: infra/docker/node-render/Dockerfile
      target: ${BUILD_TARGET:-dev}
    environment:
      STATIC_ROOT: /static
      APP_ROOT: /repo/apps/web
      BUILD_OUTPUT: /repo/apps/web/dist/web/browser
      RENDER_WATCH: ${RENDER_WATCH:-0}
      # The prerender route list (D-009). Over the compose network, not
      # localhost: the API is a sibling container.
      PRERENDER_API_ORIGIN: ${PRERENDER_API_ORIGIN:-http://api}
      # The incremental renderer serves one route at a time to the API
      # (Phase 8c). Internal to the compose network; Caddy never proxies here.
      PORT: "4000"
      # Angular 22's SSR server rejects any request whose Host is not allowlisted
      # (SSRF protection). Under dynamic rendering Caddy DOES proxy crawler
      # traffic here preserving the public Host, so the public domain must be
      # allowed or every bot request returns "Bad Request" - invisible to the
      # gate, which crawls via localhost. NG_ALLOWED_HOSTS (read at runtime)
      # overrides the baked angular.json list, so it must carry every host: the
      # internal names AND the public domain(s). Override in .env if the domain
      # changes.
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-render,localhost,127.0.0.1,officelandng.com,www.officelandng.com}
      # Trust Caddy's forwarded headers so the SSR server sees the real host and
      # https scheme (for correct canonical/OG URLs) instead of the internal
      # http hop, and so the "trustProxyHeaders not set up" warnings stop.
      NG_TRUST_PROXY_HEADERS: ${NG_TRUST_PROXY_HEADERS:-x-forwarded-host,x-forwarded-proto,x-forwarded-for,x-forwarded-port}
    volumes:
      # The monorepo layout is mirrored, not flattened: apps/web resolves
      # @contracts/api at ../../packages, so packages/ must sit two levels up.
      - ./apps/web:/repo/apps/web
      - ./packages:/repo/packages:ro
      # The gates reach outside apps/web. The CSP gate writes the Caddy
      # snippet and the icon gate reads the approved taxonomy; without these
      # two, `npm run gate` had to be split between the container and the
      # host, and the CSP half silently reported "no committed policy"
      # instead of checking one.
      - ./infra/caddy:/repo/infra/caddy
      - ./docs:/repo/docs:ro
      # Named volume keeps Linux-native node_modules out of the host bind
      # mount; the host runs Node 24.14 which is below Angular CLI 22's floor.
      - web_node_modules:/repo/apps/web/node_modules
      - static:/static
    restart: unless-stopped

volumes:
  pgdata:
  # Base backups + archived WAL. See the postgres service.
  pgbackups:
  # See the api service for why vendor/ is not on the bind mount.
  api_vendor:
  redisdata:
  web_node_modules:
  # Prerendered HTML: written by `render`, served by `api` (Caddy).
  static:
  # Content-addressed image derivatives (Phase 4).
  media:
